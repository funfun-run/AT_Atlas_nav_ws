# AT Navigator — Nav2 参数配置
# ================================
# 标注 [HW_CONFIG] 的参数需要根据实际机器人硬件调整。
# 重点关注：robot_radius、max_velocity、LiDAR topic/range、底盘坐标系名称。
#
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link  # [HW_CONFIG] 底盘根坐标系名称，需与 URDF root link 一致
    odom_topic: /odom  # [HW_CONFIG] 里程计话题，轮式里程计用 /odom，LIO用 /lio_odom
    bt_loop_duration: 10
    default_server_timeout: 20
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0  # [HW_CONFIG] 控制频率，取决于底盘响应速度和计算能力
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001  # [HW_CONFIG] 全向底盘 vy 有控制量，阈值应 > 0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5  # [HW_CONFIG] 允许控制失败的容忍时间(秒)
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2  # [HW_CONFIG] 判定"移动中"的最小位移(m)
      movement_time_allowance: 10.0  # [HW_CONFIG] 无移动超时(秒)，触发恢复行为
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.25  # [HW_CONFIG] 到达目标的位置容差(m)，比赛可适当收紧
      yaw_goal_tolerance: 0.25  # [HW_CONFIG] 到达目标的角度容差(rad)
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.3  # [HW_CONFIG] 期望线速度(m/s)，不超过底盘最大速度
      lookahead_dist: 0.6  # [HW_CONFIG] 前视距离(m)，越小追踪越紧但可能震荡
      min_lookahead_dist: 0.3
      max_lookahead_dist: 1.0
      lookahead_time: 1.5  # [HW_CONFIG] 前视时间(s)，与速度相关
      rotate_to_heading_angular_vel: 0.8  # [HW_CONFIG] 原地旋转角速度(rad/s)
      transform_tolerance: 0.2  # [HW_CONFIG] TF 变换容忍时间(s)
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05  # [HW_CONFIG] 接近目标时的最小速度(m/s)
      approach_velocity_scaling_dist: 0.6  # [HW_CONFIG] 开始减速的距离(m)
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0  # [HW_CONFIG] 碰撞预测时间窗口(s)
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9  # [HW_CONFIG] 曲率半径小于此值时开始降速(m)
      regulated_linear_scaling_min_speed: 0.1  # [HW_CONFIG] 降速下限(m/s)

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: map  # [HW_CONFIG] 行为恢复使用的参考坐标系
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0  # [HW_CONFIG] 恢复行为最大旋转速度(rad/s)
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.5  # [HW_CONFIG] 旋转加速度限制(rad/s^2)

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 1

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.5, 1.0]  # [HW_CONFIG] 全向底盘最大速度 [vx, vy, vth] — 舵轮底盘 vy 与 vx 对称
    min_velocity: [-0.2, -0.2, -1.0]  # [HW_CONFIG] 全向底盘最小/反向速度 [vx, vy, vth]
    max_accel: [0.8, 0.8, 1.5]  # [HW_CONFIG] 全向底盘最大加速度 [ax, ay, ath]
    max_decel: [-0.8, -0.8, -1.5]  # [HW_CONFIG] 全向底盘最大减速度 [ax, ay, ath]
    odom_topic: "/odom"  # [HW_CONFIG] 里程计话题
    odom_duration: 0.1
    velocity_timeout: 1.0  # [HW_CONFIG] 速度命令超时(秒)，超时后停止

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      rolling_window: false
      resolution: 0.05  # [HW_CONFIG] 代价地图分辨率(m)，通常等于地图分辨率
      track_unknown_space: true
      robot_radius: 0.35  # [HW_CONFIG] 机器人外接圆半径(m)，用于膨胀计算
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.6  # [HW_CONFIG] 障碍物膨胀半径(m)，安全裕度
        cost_scaling_factor: 3.0  # [HW_CONFIG] 代价衰减系数，越大衰减越快
      always_send_full_costmap: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4  # [HW_CONFIG] 局部代价地图宽度(m)，覆盖 LiDAR 有效范围即可
      height: 4  # [HW_CONFIG] 局部代价地图高度(m)
      resolution: 0.05  # [HW_CONFIG] 分辨率(m)，与全局代价地图一致
      robot_radius: 0.35  # [HW_CONFIG] 机器人外接圆半径(m)
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan  # [HW_CONFIG] 观测源名称，对应下方配置块
        scan:
          topic: /scan  # [HW_CONFIG] LiDAR 扫描话题
          data_type: "LaserScan"
          marking: true
          clearing: true
          min_obstacle_height: 0.0  # [HW_CONFIG] 2D 雷达设为 0
          max_obstacle_height: 0.0  # [HW_CONFIG] 2D 雷达设为 0
          obstacle_min_range: 0.0  # [HW_CONFIG] LiDAR 盲区(m)
          obstacle_max_range: 6.0  # [HW_CONFIG] LiDAR 有效探测距离(m)
          raytrace_min_range: 0.0  # [HW_CONFIG] 光线追踪清除最小距离(m)
          raytrace_max_range: 8.0  # [HW_CONFIG] 光线追踪清除最大距离(m)
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.5  # [HW_CONFIG] 局部障碍物膨胀半径(m)，局部可比全局略小
        cost_scaling_factor: 3.0  # [HW_CONFIG] 代价衰减系数
      always_send_full_costmap: true
